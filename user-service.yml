spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
    username: sa
    password: '{cipher}'


order-service:
  # url: http://localhost:8000/order-service/%s/orders # 하드코딩
  url: http://order-service/order-service/%s/orders # 유레카에 등록된 서비스 이름을 사용하여 동적으로 주문 서비스 URL 생성
  exception:
    order-is-empty: User's orders is empty # 주문이 없을 때 발생하는 예외 메세지